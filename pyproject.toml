[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trojanbites-extract"
version = "0.1.0"
description = "Restaurant and menu extraction framework for Trojan Fork (USC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40.0",
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "lxml>=5.0.0",
  "pdfplumber>=0.11.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "shapely>=2.0.0",
  "sqlalchemy>=2.0.0",
  "tenacity>=8.5.0",
  "ulid-py>=1.1.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]
ocr = [
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
]
browser = [
  "playwright>=1.40.0",
]

[project.scripts]
trojanbites = "trojanbites_extract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "src.trojanbites_extract.api.app:app"
