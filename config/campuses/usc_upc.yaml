campus_id: usc_upc
university_id: usc
display_name: USC University Park Campus
short_name: USC UPC
city: Los Angeles
region: CA
country: US

# Campus center (approx Tommy Trojan / central UPC)
center:
  lat: 34.0224
  lng: -118.2851

# Official DPS patrol/service boundary (NOT the same as Clery geography)
boundary:
  type: official_patrol
  boundary_id: usc_upc_dps
  boundary_version: v2025-01
  source_url: https://dps.usc.edu/patrol/
  notes: >
    USC DPS University Park Campus Patrol Area.
    Distinct from HSC patrol area and Clery geography.

# Academic / University Park Campus core (teammate on-campus dining ownership).
# Intentionally excludes USC Village commercial so Village retail is off-campus.
campus_boundary:
  boundary_id: usc_upc_campus
  boundary_version: v2025-01
  source_url: https://planning.lacity.gov/EIR/USC/SpecificPlans/USC%20Specific%20Plan%20(as%20approved%20by%20City%20Council).pdf
  notes: >
    Approximate UPC academic core from LA City Specific Plan / FPM narrative.
    USC Village commercial is outside this polygon (off-campus DPS pipeline).
    EVK / Parkside / Village Dining Hall remain teammate-owned via hospitality seeds.

# Dual-boundary aliases used by the off-campus DPS job
patrol_boundary:
  boundary_id: usc_upc_dps
  boundary_version: v2025-01
  source_url: https://dps.usc.edu/patrol/

pipeline_ownership:
  on_campus_teammate: campus_hospitality_dining
  off_campus: outside_campus_core_inside_dps
  village_as_off_campus: true

# Food discovery / walk preferences (product UX — not an official boundary)
discovery:
  default_walk_miles: 0.3
  max_walk_miles: 1.0
  places_tile_radius_m: 500
  included_types:
    - restaurant
    - cafe
    - meal_takeaway
    - bakery
  off_campus_dps:
    batch_limit: 5
    max_places_tiles: 12
    max_geocode_per_run: 40
    max_menu_urls_per_restaurant: 3
    max_llm_usd_per_run: 2.0
    skip_teammate_hospitality: true

# USC Hospitality / UPC seeds (permitted campus dining sources for ingest)
# Owned by the on-campus teammate pipeline — off-campus DPS job skips these.
seeds:
  - name: Everybody's Kitchen
    branch_name: EVK
    address: 642 W 34th St, Los Angeles, CA 90089
    lat: 34.0211
    lng: -118.2858
    website: https://hospitality.usc.edu/dining-hall-menus/
    menu_urls:
      - https://hospitality.usc.edu/dining-hall-menus/
    cuisines: [american, campus_dining]
    categories: [dining_hall]
    source_type: campus_hospitality
  - name: Parkside Restaurant & Grill
    branch_name: Parkside
    address: 3771 McClintock Ave, Los Angeles, CA 90089
    lat: 34.0189
    lng: -118.2901
    website: https://hospitality.usc.edu/dining-hall-menus/
    menu_urls:
      - https://hospitality.usc.edu/dining-hall-menus/
    cuisines: [american, campus_dining]
    categories: [dining_hall]
    source_type: campus_hospitality
  - name: USC Village Dining Hall
    branch_name: Village
    address: 3201 S Hoover St, Los Angeles, CA 90089
    lat: 34.0253
    lng: -118.2846
    website: https://hospitality.usc.edu/residential-dining/
    menu_urls:
      - https://hospitality.usc.edu/dining-hall-menus/
    cuisines: [american, campus_dining]
    categories: [dining_hall]
    source_type: campus_hospitality

timezone: America/Los_Angeles